name: Новости в Telegram

on:
  schedule:
    - cron: "*/10 * * * *"  # каждые 10 минут (GitHub может запускать с опозданием)
  workflow_dispatch:        # кнопка «Run workflow» для ручного запуска
    inputs:
      demo:
        description: "Прислать последний матч и кто из друзей в сети"
        type: boolean
        default: false

permissions:
  contents: write  # чтобы сохранить seen.json обратно в репозиторий

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверить новости
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python news_bot.py

      - name: Достать состояние Steam из кэша
        uses: actions/cache/restore@v4
        with:
          path: steam_state.json
          key: steam-state-${{ github.run_id }}
          restore-keys: steam-state-

      - name: Проверить игры в Dota 2 и друзей в Steam
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STRATZ_TOKEN: ${{ secrets.STRATZ_TOKEN }}
          DEMO: ${{ inputs.demo }}
        run: python steam_bot.py

      # Состояние Steam (кто из друзей в сети) хранится в кэше, а не в публичном репозитории
      - name: Сохранить состояние Steam в кэш
        if: hashFiles('steam_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: steam_state.json
          key: steam-state-${{ github.run_id }}

      - name: Запомнить отправленные новости
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "Обновить список отправленных новостей" && git push)
