name: Новости в Telegram

on:
  schedule:
    - cron: "*/15 * * * *"  # каждые 15 минут (GitHub может запускать с опозданием)
  workflow_dispatch:        # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write  # чтобы сохранить seen.json обратно в репозиторий

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверить новости
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python news_bot.py

      - name: Запомнить отправленные новости
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "Обновить список отправленных новостей" && git push)
